<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="imagenes-fondo.css">
  <title>Registro de Ninos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
</head>

<body class="bg-dark text-light p-4">

  <div class="container" style="max-width:700px;">

    <h2 class="mb-1">Registro de Ninos</h2>

    <p class="text-secondary mb-3">
      Campamento EBDV — <span id="anioActual"></span>
    </p>

    <div id="estadoCupos" class="alert alert-info">
      Cargando cupos...
    </div>

    <div id="mensajeExito" class="alert alert-success" style="display:none;"></div>
    <div id="mensajeError" class="alert alert-danger" style="display:none;"></div>

    <form id="formulario" class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Nombre</label>
        <input type="text" id="nombre" class="form-control bg-secondary text-light border-0" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Apellido</label>
        <input type="text" id="apellido" class="form-control bg-secondary text-light border-0" required>
      </div>

      <div class="col-md-4">
        <label class="form-label">Edad</label>
        <input type="number" id="edad" min="1" max="18" class="form-control bg-secondary text-light border-0" required>
      </div>

      <div class="col-md-8">
        <label class="form-label">Quien lo trajo</label>
        <input type="text" id="responsable" class="form-control bg-secondary text-light border-0" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Tanda</label>
        <select id="tanda" class="form-select bg-secondary text-light border-0" required>
          <option value="">Seleccionar tanda</option>
          <option value="primera">Primera</option>
          <option value="segunda">Segunda</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Tiene brazalete</label>
        <select id="brazalete" class="form-select bg-secondary text-light border-0" required>
          <option value="">Seleccionar</option>
          <option value="si">Si</option>
          <option value="no">No</option>
        </select>
      </div>

      <!-- CONDICION ESPECIAL -->
      <div class="col-md-6">
        <label class="form-label">Requiere atencion especial</label>
        <select id="requiereAtencion" class="form-select bg-secondary text-light border-0" required onchange="toggleDetalles()">
          <option value="">Seleccionar</option>
          <option value="no">No</option>
          <option value="si">Si</option>
        </select>
      </div>

      <div class="col-md-6" id="campoDetalles" style="display:none;">
        <label class="form-label">Detalles de la condicion</label>
        <textarea id="condicionEspecial" class="form-control bg-secondary text-light border-0" rows="2"
          placeholder="Ej: alergia al mani, asma, requiere medicacion..."></textarea>
      </div>

      <div class="col-12 d-flex gap-2">
        <button type="submit" id="btnRegistrar" class="btn btn-primary">Registrar</button>
        <a href="consulta.html" class="btn btn-outline-light">Ver Consultas</a>
      </div>

    </form>
  </div>

  <script src="footer.js"></script>
  <script src="imagenes-fondo.js"></script>

  <script>
    const CUPOS = { primera: 225, segunda: 275 };
    const anioActual = new Date().getFullYear();

    document.getElementById("anioActual").textContent = "Anio " + anioActual;

    function toggleDetalles() {
      const val = document.getElementById("requiereAtencion").value;
      const campo = document.getElementById("campoDetalles");
      campo.style.display = val === "si" ? "block" : "none";
      if (val !== "si") document.getElementById("condicionEspecial").value = "";
    }

    auth.onAuthStateChanged(function(user) {
      if (!user) { window.location.href = "login.html"; return; }
      verificarCupos();
    });

    async function verificarCupos() {
      const estado = document.getElementById("estadoCupos");

      const snapshot = await db.collection("ninos")
        .where("anio", "==", anioActual)
        .get();

      let primeraCount = 0, segundaCount = 0;
      snapshot.forEach(function(doc) {
        const d = doc.data();
        if (d.tanda === "primera") primeraCount++;
        if (d.tanda === "segunda") segundaCount++;
      });

      estado.innerHTML =
        "<strong>Primera tanda:</strong> " + primeraCount + "/" + CUPOS.primera +
        " (" + (CUPOS.primera - primeraCount) + " disponibles)" +
        "<br><br>" +
        "<strong>Segunda tanda:</strong> " + segundaCount + "/" + CUPOS.segunda +
        " (" + (CUPOS.segunda - segundaCount) + " disponibles)";

      estado.className = (primeraCount >= CUPOS.primera || segundaCount >= CUPOS.segunda)
        ? "alert alert-danger"
        : "alert alert-info";
    }

    document.getElementById("formulario").addEventListener("submit", async function(e) {
      e.preventDefault();

      const user = auth.currentUser;
      if (!user) { window.location.href = "login.html"; return; }

      const btn = document.getElementById("btnRegistrar");
      const exito = document.getElementById("mensajeExito");
      const error = document.getElementById("mensajeError");

      btn.disabled = true;
      btn.textContent = "Guardando...";
      exito.style.display = "none";
      error.style.display = "none";

      const tandaValor = document.getElementById("tanda").value;
      const requiereAtencion = document.getElementById("requiereAtencion").value;

      const snapshot = await db.collection("ninos")
        .where("anio", "==", anioActual)
        .where("tanda", "==", tandaValor)
        .get();

      if (snapshot.size >= CUPOS[tandaValor]) {
        error.textContent = "La tanda seleccionada ya alcanzo el limite permitido.";
        error.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Registrar";
        return;
      }

      const nuevoRegistro = {
        nombre: document.getElementById("nombre").value.trim(),
        apellido: document.getElementById("apellido").value.trim(),
        edad: parseInt(document.getElementById("edad").value.trim()),
        quienLoTrajo: document.getElementById("responsable").value.trim(),
        tanda: tandaValor,
        tieneBrazalete: document.getElementById("brazalete").value,
        requiereAtencionEspecial: requiereAtencion,
        condicionEspecial: requiereAtencion === "si"
          ? document.getElementById("condicionEspecial").value.trim()
          : "",
        anio: anioActual,
        registradoPor: user.email,
        fechaRegistro: firebase.firestore.Timestamp.now()
      };

      try {
        const docRef = await db.collection("ninos").add(nuevoRegistro);

        await db.collection("historial_ediciones").add({
          tipo: "registro_nuevo",
          campo: "Nuevo registro",
          antes: "-",
          despues: nuevoRegistro.nombre + " " + nuevoRegistro.apellido + " — " + tandaValor + " tanda" +
            (requiereAtencion === "si" ? " atencion especial" : ""),
          editadoPor: user.email,
          editadoEn: firebase.firestore.Timestamp.now(),
          idDocumento: docRef.id
        });

        exito.textContent = nuevoRegistro.nombre + " " + nuevoRegistro.apellido + " registrado correctamente.";
        exito.style.display = "block";
        e.target.reset();
        document.getElementById("campoDetalles").style.display = "none";
        verificarCupos();

      } catch(err) {
        console.error(err);
        error.textContent = "Error al guardar registro.";
        error.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Registrar";
      }
    });
  </script>

</body>
</html>
