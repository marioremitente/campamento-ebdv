<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="imagenes-fondo.css">
  <title>Estadisticas — Campamento EBDV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
</head>
<body class="bg-dark text-light p-4">
  <div class="container" style="max-width:700px;">

    <div class="d-flex justify-content-between align-items-center mb-1">
      <h2 class="mb-0">Estadisticas</h2>
      <a href="login.html" class="btn btn-outline-warning btn-sm">Iniciar Sesion</a>
    </div>
    <p class="text-secondary mb-3">Resumen general del Campamento EBDV</p>

    <div class="mb-4">
      <select id="filtroAnio" class="form-select bg-secondary text-light border-0" style="max-width:200px;">
        <option value="">Todos los anios</option>
      </select>
    </div>

    <div id="cargando" class="text-secondary">Cargando estadisticas...</div>
    <div id="reporte" class="mt-3"></div>

    <a href="login.html" class="btn btn-warning mt-4">← Volver al inicio</a>
  </div>

  <script src="footer.js"></script>

  <script>
    // NO requiere autenticacion — acceso publico
    var todosLosDatos = [];

    db.collection("ninos").get().then(function(snapshot) {
      document.getElementById("cargando").style.display = "none";

      if (snapshot.empty) {
        document.getElementById("reporte").innerHTML =
          "<p class='text-secondary'>No hay registros todavia.</p>";
        return;
      }

      todosLosDatos = [];
      snapshot.forEach(function(doc) { todosLosDatos.push(doc.data()); });

      var anios = [];
      todosLosDatos.forEach(function(d) {
        if (d.anio && !anios.includes(d.anio)) anios.push(d.anio);
      });
      anios.sort(function(a, b) { return b - a; });

      var select = document.getElementById("filtroAnio");
      anios.forEach(function(anio) {
        var opt = document.createElement("option");
        opt.value = anio;
        opt.textContent = anio;
        select.appendChild(opt);
      });

      var anioActual = new Date().getFullYear();
      if (anios.includes(anioActual)) select.value = anioActual;

      mostrarEstadisticas(select.value);

      select.addEventListener("change", function() {
        mostrarEstadisticas(select.value);
      });

    }).catch(function(err) {
      console.error(err);
      document.getElementById("cargando").textContent = "Error al cargar estadisticas.";
    });

    function mostrarEstadisticas(anioFiltro) {
      var datos = anioFiltro
        ? todosLosDatos.filter(function(d) { return String(d.anio) === String(anioFiltro); })
        : todosLosDatos;

      var conteoEdad = {};
      var conteoTanda = { primera: 0, segunda: 0 };
      var conteoBrazalete = { si: 0, no: 0 };
      var conteoAtencion = { si: 0, no: 0 };
      var total = datos.length;

      datos.forEach(function(d) {
        var edad = (d.edad !== undefined && d.edad !== null) ? d.edad : "Sin edad";
        conteoEdad[edad] = (conteoEdad[edad] || 0) + 1;

        var tanda = d.tanda ? d.tanda.toLowerCase() : "";
        if (tanda === "primera") conteoTanda.primera++;
        else if (tanda === "segunda") conteoTanda.segunda++;

        if (d.tieneBrazalete === "si") conteoBrazalete.si++;
        else conteoBrazalete.no++;

        if (d.requiereAtencionEspecial === "si") conteoAtencion.si++;
        else conteoAtencion.no++;
      });

      var edadesOrdenadas = Object.keys(conteoEdad).sort(function(a, b) {
        return Number(a) - Number(b);
      });

      var titulo = anioFiltro ? "Campamento " + anioFiltro : "Todos los campamentos";

      var filasEdad = edadesOrdenadas.map(function(edad) {
        var etiqueta = edad === "Sin edad" ? "Sin edad registrada" : edad + " anio(s)";
        return "<li class='list-group-item bg-dark text-white d-flex justify-content-between align-items-center'>" +
          etiqueta +
          "<span class='badge bg-primary'>" + conteoEdad[edad] + "</span>" +
          "</li>";
      }).join("");

      document.getElementById("reporte").innerHTML =
        "<h5 class='text-info mb-3'>" + titulo + "</h5>" +

        "<div class='row g-3 mb-4'>" +
          "<div class='col-md-4'>" +
            "<div class='card bg-secondary text-white text-center p-3'>" +
              "<h1 class='mb-0'>" + total + "</h1>" +
              "<small>Total de ninos</small>" +
            "</div>" +
          "</div>" +
          "<div class='col-md-4'>" +
            "<div class='card bg-secondary text-white text-center p-3'>" +
              "<h1 class='mb-0'>" + conteoTanda.primera + "</h1>" +
              "<small>Primera tanda</small>" +
            "</div>" +
          "</div>" +
          "<div class='col-md-4'>" +
            "<div class='card bg-secondary text-white text-center p-3'>" +
              "<h1 class='mb-0'>" + conteoTanda.segunda + "</h1>" +
              "<small>Segunda tanda</small>" +
            "</div>" +
          "</div>" +
        "</div>" +

        "<h5>Distribucion por Edad</h5>" +
        "<ul class='list-group mb-4'>" + filasEdad + "</ul>" +

        "<h5>Brazalete</h5>" +
        "<ul class='list-group mb-4'>" +
          "<li class='list-group-item bg-dark text-white d-flex justify-content-between align-items-center'>" +
            "Con brazalete <span class='badge bg-success'>" + conteoBrazalete.si + "</span></li>" +
          "<li class='list-group-item bg-dark text-white d-flex justify-content-between align-items-center'>" +
            "Sin brazalete <span class='badge bg-secondary'>" + conteoBrazalete.no + "</span></li>" +
        "</ul>" +

        "<h5>Atencion Especial</h5>" +
        "<ul class='list-group'>" +
          "<li class='list-group-item bg-dark text-white d-flex justify-content-between align-items-center'>" +
            "Requieren atencion <span class='badge bg-warning text-dark'>" + conteoAtencion.si + "</span></li>" +
          "<li class='list-group-item bg-dark text-white d-flex justify-content-between align-items-center'>" +
            "Sin atencion especial <span class='badge bg-secondary'>" + conteoAtencion.no + "</span></li>" +
        "</ul>";
    }
  </script>

  <script src="imagenes-fondo.js"></script>
</body>
</html>
