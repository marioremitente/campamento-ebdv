<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="imagenes-fondo.css">
  <title>Estadisticas — Campamento EBDV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="config.js"></script>
</head>
<body class="bg-dark text-light p-4">
  <div class="container" style="max-width:700px;">

    <div class="d-flex justify-content-between align-items-center mb-1">
      <h2 class="mb-0">Estadisticas</h2>
      <a href="login.html" class="btn btn-outline-warning btn-sm">Iniciar Sesion</a>
    </div>
    <p class="text-secondary mb-3">Resumen general del Campamento EBDV</p>

    <div class="mb-4">
      <select id="filtroAnio" class="form-select bg-secondary text-light border-0" style="max-width:200px;">
        <option value="">Todos los anios</option>
      </select>
    </div>

    <div id="cargando" class="text-secondary">Cargando estadisticas...</div>
    <div id="reporte" class="mt-3"></div>

    <a href="login.html" class="btn btn-warning mt-4">← Volver al inicio</a>
  </div>

  <script src="footer.js"></script>

  <script>
    // Se lee SOLO el resumen agregado (stats_publicas) que contiene unicamente
    // totales (numeros). NO se lee la coleccion "ninos" para no exponer datos
    // personales o de salud de los menores.
    var resumenGlobal = null;

    db.collection("stats_publicas").doc("resumen").get().then(function(doc) {
      document.getElementById("cargando").style.display = "none";

      if (!doc.exists) {
        document.getElementById("reporte").innerHTML =
          "<p class='text-secondary'>Aun no hay estadisticas disponibles. El resumen se genera cuando se registran ninos.</p>";
        return;
      }

      resumenGlobal = doc.data();

      var anios = Object.keys(resumenGlobal.porAnio || {});
      anios.sort(function(a, b) { return Number(b) - Number(a); });

      var select = document.getElementById("filtroAnio");
      anios.forEach(function(anio) {
        var opt = document.createElement("option");
        opt.value = anio;
        opt.textContent = anio;
        select.appendChild(opt);
      });

      mostrarEstadisticas(select.value);

      select.addEventListener("change", function() {
        mostrarEstadisticas(select.value);
      });
    }).catch(function(err) {
      console.error(err);
      document.getElementById("cargando").textContent = "Error al cargar estadisticas.";
    });

    function mostrarEstadisticas(anioFiltro) {
      var porAnio = resumenGlobal.porAnio || {};
      var porEdad = resumenGlobal.porEdad || {};

      var total = resumenGlobal.total || 0;
      var primera = resumenGlobal.porTanda ? (resumenGlobal.porTanda.primera || 0) : 0;
      var segunda = resumenGlobal.porTanda ? (resumenGlobal.porTanda.segunda || 0) : 0;
      var conBrazalete = resumenGlobal.conBrazalete || 0;
      var sinBrazalete = resumenGlobal.sinBrazalete || 0;
      var requiereAtencion = resumenGlobal.requiereAtencion || 0;
      var sinAtencion = resumenGlobal.sinAtencion || 0;

      // Filtrar por anio si aplica
      if (anioFiltro) {
        total = porAnio[anioFiltro] || 0;
      }

      var filasEdad = Object.keys(porEdad).sort(function(a, b) {
        return a === "sin_edad" ? 1 : (b === "sin_edad" ? -1 : Number(a) - Number(b));
      }).map(function(edad) {
        var etiqueta = edad === "sin_edad" ? "Sin edad registrada" : edad + " anio(s)";
        return "<li class='list-group-item bg-dark text-white d-flex justify-content-between align-items-center'>" +
          escapeHtml(etiqueta) +
          "<span class='badge bg-primary'>" + (porEdad[edad] || 0) + "</span>" +
          "</li>";
      }).join("");

      if (!filasEdad) {
        filasEdad = "<li class='list-group-item bg-dark text-white'>Sin datos por edad.</li>";
      }

      var titulo = anioFiltro ? "Campamento " + anioFiltro : "Todos los campamentos";

      document.getElementById("reporte").innerHTML =
        "<h5 class='text-info mb-3'>" + escapeHtml(titulo) + "</h5>" +

        "<div class='row g-3 mb-4'>" +
          "<div class='col-md-4'>" +
            "<div class='card bg-secondary text-white text-center p-3'>" +
              "<h1 class='mb-0'>" + total + "</h1>" +
              "<small>Total de ninos</small>" +
            "</div>" +
          "</div>" +
          "<div class='col-md-4'>" +
            "<div class='card bg-secondary text-white text-center p-3'>" +
              "<h1 class='mb-0'>" + (anioFiltro ? "—" : primera) + "</h1>" +
              "<small>Primera tanda</small>" +
            "</div>" +
          "</div>" +
          "<div class='col-md-4'>" +
            "<div class='card bg-secondary text-white text-center p-3'>" +
              "<h1 class='mb-0'>" + (anioFiltro ? "—" : segunda) + "</h1>" +
              "<small>Segunda tanda</small>" +
            "</div>" +
          "</div>" +
        "</div>" +

        "<h5>Distribucion por Edad</h5>" +
        "<ul class='list-group mb-4'>" + filasEdad + "</ul>" +

        "<h5>Brazalete</h5>" +
        "<ul class='list-group mb-4'>" +
          "<li class='list-group-item bg-dark text-white d-flex justify-content-between align-items-center'>" +
            "Con brazalete <span class='badge bg-success'>" + (anioFiltro ? "—" : conBrazalete) + "</span></li>" +
          "<li class='list-group-item bg-dark text-white d-flex justify-content-between align-items-center'>" +
            "Sin brazalete <span class='badge bg-secondary'>" + (anioFiltro ? "—" : sinBrazalete) + "</span></li>" +
        "</ul>" +

        "<h5>Atencion Especial</h5>" +
        "<ul class='list-group'>" +
          "<li class='list-group-item bg-dark text-white d-flex justify-content-between align-items-center'>" +
            "Requieren atencion <span class='badge bg-warning text-dark'>" + (anioFiltro ? "—" : requiereAtencion) + "</span></li>" +
          "<li class='list-group-item bg-dark text-white d-flex justify-content-between align-items-center'>" +
            "Sin atencion especial <span class='badge bg-secondary'>" + (anioFiltro ? "—" : sinAtencion) + "</span></li>" +
        "</ul>";
    }
  </script>

  <script src="imagenes-fondo.js"></script>
</body>
</html>
