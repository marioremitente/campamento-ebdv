<!DOCTYPE html>
<html lang="es">

<head>
  <link rel="stylesheet" href="imagenes-fondo.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="config.js"></script>
</head>

<body class="bg-dark text-light p-4">

  <div class="container" style="max-width:700px;">

    <h2 class="mb-1">Editar Registro</h2>
    <p class="text-secondary mb-4">Modifica los datos del nino registrado.</p>

    <div id="cargando" class="text-secondary mb-3">Cargando datos...</div>

    <form id="formEditar" class="row g-3" style="display:none;">

      <div class="col-md-6">
        <label class="form-label">Nombre</label>
        <input type="text" id="nombre" class="form-control bg-secondary text-light border-0" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Apellido</label>
        <input type="text" id="apellido" class="form-control bg-secondary text-light border-0" required>
      </div>

      <div class="col-md-4">
        <label class="form-label">Edad</label>
        <input type="number" id="edad" min="1" max="18" class="form-control bg-secondary text-light border-0" required>
      </div>

      <div class="col-md-8">
        <label class="form-label">Quien lo trajo</label>
        <input type="text" id="responsable" class="form-control bg-secondary text-light border-0" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Tanda</label>
        <select id="tanda" class="form-select bg-secondary text-light border-0" required>
          <option value="">Seleccionar tanda</option>
          <option value="primera">Primera</option>
          <option value="segunda">Segunda</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Tiene brazalete</label>
        <select id="brazalete" class="form-select bg-secondary text-light border-0" required>
          <option value="">Seleccionar</option>
          <option value="si">Si</option>
          <option value="no">No</option>
        </select>
      </div>

      <!-- CONDICION ESPECIAL -->
      <div class="col-md-6">
        <label class="form-label">Requiere atencion especial</label>
        <select id="requiereAtencion" class="form-select bg-secondary text-light border-0" required onchange="toggleDetalles()">
          <option value="">Seleccionar</option>
          <option value="no">No</option>
          <option value="si">Si</option>
        </select>
      </div>

      <div class="col-md-6" id="campoDetalles" style="display:none;">
        <label class="form-label">Detalles de la condicion</label>
        <textarea id="condicionEspecial" class="form-control bg-secondary text-light border-0" rows="2"
          placeholder="Ej: alergia al mani, asma, requiere medicacion..."></textarea>
      </div>

      <div class="col-12 d-flex gap-2">
        <button type="submit" id="btnGuardar" class="btn btn-success">Guardar Cambios</button>
        <a href="consulta.html" class="btn btn-outline-light">Cancelar</a>
      </div>

    </form>

    <div id="mensajeError" class="alert alert-danger mt-3" style="display:none;"></div>

  </div>

  <script src="footer.js"></script>

  <script>
    var id = localStorage.getItem("registroEditarId");
    var datosOriginales = {};

    function toggleDetalles() {
      var val = document.getElementById("requiereAtencion").value;
      var campo = document.getElementById("campoDetalles");
      campo.style.display = val === "si" ? "block" : "none";
      if (val !== "si") document.getElementById("condicionEspecial").value = "";
    }

    auth.onAuthStateChanged(function(user) {
      if (!user) { window.location.href = "login.html"; return; }

      if (!id) {
        alert("No se encontro el ID.");
        window.location.href = "consulta.html";
        return;
      }

      db.collection("ninos").doc(id).get().then(function(doc) {

        if (!doc.exists) {
          alert("Registro no encontrado.");
          window.location.href = "consulta.html";
          return;
        }

        var data = doc.data();
        datosOriginales = Object.assign({}, data);

        document.getElementById("nombre").value = data.nombre || "";
        document.getElementById("apellido").value = data.apellido || "";
        document.getElementById("edad").value = data.edad || "";
        document.getElementById("responsable").value = data.quienLoTrajo || "";
        document.getElementById("tanda").value = data.tanda || "";

        // CORREGIDO: antes usaba ternario booleano, ahora lee el string directamente
        document.getElementById("brazalete").value = data.tieneBrazalete || "";

        // NUEVO: cargar campos de atencion especial
        document.getElementById("requiereAtencion").value = data.requiereAtencionEspecial || "";
        if (data.requiereAtencionEspecial === "si") {
          document.getElementById("campoDetalles").style.display = "block";
          document.getElementById("condicionEspecial").value = data.condicionEspecial || "";
        }

        document.getElementById("cargando").style.display = "none";
        document.getElementById("formEditar").style.display = "flex";

      }).catch(function(err) {
        console.error(err);
        document.getElementById("cargando").textContent = "Error al cargar.";
      });
    });

    document.getElementById("formEditar").addEventListener("submit", function(e) {
      e.preventDefault();

      var btn = document.getElementById("btnGuardar");
      var errorEl = document.getElementById("mensajeError");

      btn.disabled = true;
      btn.textContent = "Guardando...";
      errorEl.style.display = "none";

      var requiereAtencion = document.getElementById("requiereAtencion").value;

      var nuevosDatos = {
        nombre: document.getElementById("nombre").value.trim(),
        apellido: document.getElementById("apellido").value.trim(),
        edad: parseInt(document.getElementById("edad").value.trim(), 10),
        quienLoTrajo: document.getElementById("responsable").value.trim(),
        tanda: document.getElementById("tanda").value,
        // CORREGIDO: se guarda como string "si"/"no", no como booleano
        tieneBrazalete: document.getElementById("brazalete").value,
        // NUEVO: campos de atencion especial
        requiereAtencionEspecial: requiereAtencion,
        condicionEspecial: requiereAtencion === "si"
          ? document.getElementById("condicionEspecial").value.trim()
          : "",
        ultimaEdicion: firebase.firestore.Timestamp.now(),
        editadoPor: auth.currentUser ? auth.currentUser.email : "desconocido"
      };

      var historialRef = db.collection("historial_ediciones");

      var camposComparar = [
        "nombre", "apellido", "edad", "quienLoTrajo",
        "tanda", "tieneBrazalete", "requiereAtencionEspecial", "condicionEspecial"
      ];

      var promesasHistorial = [];

      camposComparar.forEach(function(campo) {
        var antes = String(datosOriginales[campo] || "");
        var despues = String(nuevosDatos[campo] || "");
        if (antes !== despues) {
          promesasHistorial.push(
            historialRef.add({
              campo: campo,
              antes: antes,
              despues: despues,
              editadoPor: auth.currentUser ? auth.currentUser.email : "desconocido",
              editadoEn: firebase.firestore.Timestamp.now(),
              idDocumento: id
            })
          );
        }
      });

      db.collection("ninos").doc(id).update(nuevosDatos)
        .then(function() { return Promise.all(promesasHistorial); })
        .then(function() {
          recalcularResumenPublico();
          localStorage.removeItem("registroEditarId");
          window.location.href = "consulta.html";
        })
        .catch(function(err) {
          console.error(err);
          errorEl.textContent = "Error al guardar: " + err.message;
          errorEl.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Guardar Cambios";
        });
    });
  </script>

  <script src="imagenes-fondo.js"></script>
</body>
</html>
