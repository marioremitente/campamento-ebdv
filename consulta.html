<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="imagenes-fondo.css">
  <title>Consulta de Registros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="config.js"></script>
</head>
<body class="bg-dark text-light p-4">
  <div class="container">

    <div id="contenidoProtegido" style="display:none;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="mb-0">Consulta de Registros</h2>
          <small class="text-secondary" id="totalRegistros"></small>
        </div>
        <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">Cerrar sesion</button>
      </div>

      <div class="row mb-3 g-2">
        <div class="col-md-3">
          <input type="text" id="busqueda" class="form-control bg-secondary text-light border-0" placeholder="Buscar por nombre o apellido">
        </div>
        <div class="col-md-2">
          <input type="number" id="busquedaEdad" class="form-control bg-secondary text-light border-0" placeholder="Edad">
        </div>
        <div class="col-md-2">
          <select id="busquedaTanda" class="form-select bg-secondary text-light border-0">
            <option value="">Todas las tandas</option>
            <option value="primera">Primera</option>
            <option value="segunda">Segunda</option>
          </select>
        </div>
        <div class="col-md-2">
          <select id="busquedaAnio" class="form-select bg-secondary text-light border-0">
            <option value="">Seleccionar anio</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="busquedaAtencion" class="form-select bg-secondary text-light border-0">
            <option value="">Todos</option>
            <option value="si">Solo atencion especial</option>
            <option value="no">Sin atencion especial</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered table-dark align-middle">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Edad</th>
              <th>Responsable</th>
              <th>Tanda</th>
              <th>Brazalete</th>
              <th>Atencion</th>
              <th>Condicion</th>
              <th>Anio</th>
              <th>Registrado por</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="contenidoTabla">
            <tr>
              <td colspan="11" class="text-center text-secondary py-4">
                Selecciona un anio, tanda o escribe un nombre para ver los registros.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- BOTONES USUARIO NORMAL — sin historial ni respaldo -->
      <div class="row mt-3 g-2">
        <div class="col-md-6">
          <a href="index_registro.html" class="btn btn-outline-light w-100">+ Nuevo Registro</a>
        </div>
        <div class="col-md-6">
          <a href="estadisticas-edad.html" class="btn btn-outline-light w-100">Estadisticas</a>
        </div>
      </div>
    </div>

    <div id="contenidoRestringido" style="display:none;">
      <div class="alert alert-danger mt-4">Contenido protegido. Debes iniciar sesion.</div>
      <a href="login.html" class="btn btn-primary">Ir al Login</a>
    </div>
  </div>

  <script src="footer.js"></script>

  <script>

    function cerrarSesion() {
      auth.signOut().then(function() { window.location.href = "login.html"; });
    }

    auth.onAuthStateChanged(function(user) {
      if (!user) {
        document.getElementById("contenidoProtegido").style.display = "none";
        document.getElementById("contenidoRestringido").style.display = "block";
        return;
      }
      // Admin redirige a su panel
      if (esAdmin(user)) {
        window.location.href = "consulta-admin.html";
        return;
      }
      document.getElementById("contenidoProtegido").style.display = "block";
      document.getElementById("contenidoRestringido").style.display = "none";
      iniciarTabla();
    });

    function hayFiltroActivo() {
      return document.getElementById("busqueda").value.trim() !== "" ||
             document.getElementById("busquedaEdad").value.trim() !== "" ||
             document.getElementById("busquedaTanda").value !== "" ||
             document.getElementById("busquedaAnio").value !== "" ||
             document.getElementById("busquedaAtencion").value !== "";
    }

    function iniciarTabla() {
      db.collection("ninos").get().then(function(snapshot) {
        var aniosSet = new Set();
        snapshot.forEach(function(doc) {
          var a = doc.data().anio;
          if (a) aniosSet.add(a);
        });
        var select = document.getElementById("busquedaAnio");
        select.innerHTML = "<option value=''>Seleccionar anio</option>";
        Array.from(aniosSet).sort(function(a, b) { return b - a; }).forEach(function(a) {
          var opt = document.createElement("option");
          opt.value = a; opt.textContent = a;
          select.appendChild(opt);
        });
      });

      function cargar() {
        var tabla = document.getElementById("contenidoTabla");
        var totalEl = document.getElementById("totalRegistros");

        if (!hayFiltroActivo()) {
          tabla.innerHTML = "<tr><td colspan='11' class='text-center text-secondary py-4'>Selecciona un anio, tanda o escribe un nombre para ver los registros.</td></tr>";
          totalEl.textContent = "";
          return;
        }

        var texto = document.getElementById("busqueda").value.toLowerCase().trim();
        var edadFiltro = document.getElementById("busquedaEdad").value.trim();
        var tandaFiltro = document.getElementById("busquedaTanda").value;
        var anioFiltro = document.getElementById("busquedaAnio").value;
        var atencionFiltro = document.getElementById("busquedaAtencion").value;

        tabla.innerHTML = "<tr><td colspan='11' class='text-center'>Cargando...</td></tr>";

        var query = db.collection("ninos");
        if (anioFiltro) query = query.where("anio", "==", parseInt(anioFiltro));
        if (tandaFiltro) query = query.where("tanda", "==", tandaFiltro);

        query.get().then(function(snapshot) {
          tabla.innerHTML = "";
          var count = 0;

          snapshot.forEach(function(doc) {
            var d = doc.data();
            var nombreCompleto = ((d.nombre || "") + " " + (d.apellido || "")).toLowerCase();

            if (texto && !nombreCompleto.includes(texto)) return;
            if (edadFiltro && String(d.edad) !== edadFiltro) return;
            if (atencionFiltro && d.requiereAtencionEspecial !== atencionFiltro) return;

            count++;
            var tieneBrazalete = d.tieneBrazalete === "si";
            var tieneAtencion = d.requiereAtencionEspecial === "si";

            var fila = document.createElement("tr");
            fila.innerHTML =
              "<td>" + escapeHtml(d.nombre || "-") + "</td>" +
              "<td>" + escapeHtml(d.apellido || "-") + "</td>" +
              "<td>" + escapeHtml(d.edad || "-") + "</td>" +
              "<td>" + escapeHtml(d.quienLoTrajo || "-") + "</td>" +
              "<td>" + escapeHtml(d.tanda || "-") + "</td>" +
              "<td><span class='badge " + (tieneBrazalete ? "bg-success" : "bg-secondary") + "'>" + (tieneBrazalete ? "Si" : "No") + "</span></td>" +
              "<td>" + (tieneAtencion ? "<span class='badge bg-warning text-dark'>Si</span>" : "<span class='badge bg-secondary'>No</span>") + "</td>" +
              "<td><small>" + (tieneAtencion && d.condicionEspecial ? escapeHtml(d.condicionEspecial) : "-") + "</small></td>" +
              "<td><span class='badge bg-info text-dark'>" + escapeHtml(d.anio || "-") + "</span></td>" +
              "<td><small class='text-secondary'>" + escapeHtml(d.registradoPor || "-") + "</small></td>" +
              "<td>" +
                "<button class='btn btn-sm btn-warning' onclick=\"editarRegistro('" + escapeHtml(doc.id) + "')\">Editar</button>" +
              "</td>";
            tabla.appendChild(fila);
          });

          if (count === 0) {
            tabla.innerHTML = "<tr><td colspan='11' class='text-center text-secondary'>No se encontraron registros.</td></tr>";
          }
          totalEl.textContent = count + " registro(s) encontrado(s)";
        }).catch(function(err) {
          console.error(err);
          tabla.innerHTML = "<tr><td colspan='11' class='text-center text-danger'>Error cargando datos.</td></tr>";
        });
      }

      document.getElementById("busqueda").addEventListener("input", cargar);
      document.getElementById("busquedaEdad").addEventListener("input", cargar);
      document.getElementById("busquedaTanda").addEventListener("change", cargar);
      document.getElementById("busquedaAnio").addEventListener("change", cargar);
      document.getElementById("busquedaAtencion").addEventListener("change", cargar);
    }

    function editarRegistro(id) {
      localStorage.setItem("registroEditarId", id);
      window.location.href = "editar.html";
    }
  </script>

  <script src="imagenes-fondo.js"></script>
</body>
</html>
